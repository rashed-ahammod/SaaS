# CI (guide §22): lint -> type-check -> unit -> integration (real PostgreSQL) -> build -> audit.
# Security scans (guide §20, WP12): dependency audit (no high-severity findings) in each job,
# CodeQL static analysis (security-and-quality queries) and a secret scan of the full history.
# Assumes the git repository root is E:\SaaS (see backend/README.md "Git").
name: ci
on:
  push:
  pull_request:

# Every push is tested, wherever it lands. A pull request whose branch lives in
# THIS repository was already tested by that push, so the pull_request event
# would run the whole matrix a second time on the same commit -- including the
# backend job with its PostgreSQL service -- and a free account's Actions
# minutes are finite. A pull request from a fork has no such push event here, so
# that one does run. Each job repeats the condition below, because GitHub has no
# workflow-level `if` and no YAML anchors in workflow files.
#
#   if: github.event_name != 'pull_request' ||
#       github.event.pull_request.head.repo.full_name != github.repository

# Read-only GITHUB_TOKEN for every job. Jobs that need more say so themselves
# (codeql asks for security-events: write). Without this the token carries
# whatever the repository's default is, which may include write access to the
# code -- far more than a test run needs if a dependency were ever compromised.
permissions:
  contents: read

# A second push to the same branch makes the first run's result irrelevant:
# cancel it instead of paying for both. Never cancel on the default branch,
# where every commit's result is a record worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # fork pull requests only (see the note at the top)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PG_HOST: localhost
      PG_DATABASE: erp_dev
      PG_TEST_DATABASE: erp_test
      PG_ADMIN_USER: postgres
      PG_ADMIN_PASSWORD: postgres
      PG_OWNER_PASSWORD: ci-owner
      PG_APP_PASSWORD: ci-app
      PG_WORKER_PASSWORD: ci-worker
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      FIELD_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      # The integration tests exercise the AI reader and the outbox. Without
      # these two the gateway answers AI_OFF and signCallbackToken gets an
      # undefined secret, which failed 9 tests in bank/close/notifications.
      # 'fake' is the deterministic in-process provider; no API key is used.
      AI_PROVIDER: fake
      OUTBOX_WEBHOOK_SECRET: ci-only-outbox-webhook-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:setup
      - run: npm run test:int
      - run: npm run build
      # no high-severity advisories, in production or development dependencies
      - run: npm audit --audit-level=high

  web:
    runs-on: ubuntu-latest
    # fork pull requests only (see the note at the top)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    defaults:
      run:
        working-directory: Frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # production dependencies; the dev-only eslint braces advisory is an accepted risk (docs/security/checklist.md)
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    # fork pull requests only (see the note at the top)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4

  secrets:
    runs-on: ubuntu-latest
    # fork pull requests only (see the note at the top)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
