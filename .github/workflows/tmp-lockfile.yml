# TEMPORARY. Regenerates Frontend/web/package-lock.json on Linux, because the
# lockfile's wasm32 optional-dependency branch cannot be resolved on Windows.
# Delete this file once the lockfile is committed.
name: tmp-lockfile
on: workflow_dispatch

jobs:
  regen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only
      - run: npm ci --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: web-lockfile
          path: Frontend/web/package-lock.json
