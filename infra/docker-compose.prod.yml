# Self-hosted production stack (guide §22, docs/operations/runbooks/deploy.md).
#
# Runs the whole ERP on one machine: your own computer, a server at the
# customer's office, or any VPS. Nothing but the Cloudflare tunnel reaches the
# internet, and the database publishes no port at all.
#
#   cd infra
#   cp .env.production.example .env     and fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# First workspace (once the stack is up):
#   docker compose -f docker-compose.prod.yml run --rm \
#     -e BOOTSTRAP_OWNER_PASSWORD='<one-time password>' api \
#     npm run bootstrap:tenant -- --slug=acme --name="Acme Trading Ltd" \
#       --email=admin@acme.com.bd
#
# Backup (schedule this on the host, e.g. with cron):
#   docker compose -f docker-compose.prod.yml exec api npm run backup

name: erp

x-api-env: &api-env
  NODE_ENV: production
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DATABASE: ${PG_DATABASE:-erp}
  PG_OWNER_PASSWORD: ${PG_OWNER_PASSWORD:?set it in infra/.env}
  PG_APP_PASSWORD: ${PG_APP_PASSWORD:?set it in infra/.env}
  PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD:?set it in infra/.env}
  JWT_SECRET: ${JWT_SECRET:?set it in infra/.env}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set it in infra/.env}
  METRICS_TOKEN: ${METRICS_TOKEN:?set it in infra/.env}
  SECURITY_MFA_ENFORCED: "true"
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?the https address of the employee app}
  FILE_STORAGE_DRIVER: local
  FILE_STORAGE_DIR: /app/storage
  BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set it in infra/.env}
  BACKUP_DIR: /app/backups
  PG_BACKUP_PASSWORD: ${PG_BACKUP_PASSWORD:?set it in infra/.env}
  AI_PROVIDER: ${AI_PROVIDER:-off}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OUTBOX_WEBHOOK_BASE_URL: ${OUTBOX_WEBHOOK_BASE_URL:-}
  OUTBOX_WEBHOOK_SECRET: ${OUTBOX_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?set it in infra/.env}
    # No `ports:`. Only this compose network reaches the database, which is why
    # the application may connect without TLS.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the four roles and the database on first run, then applies pending
  # migrations. Both steps are idempotent, so this runs on every `up` and the
  # API waits for it: /health/ready reports "not ready" until migrations are in.
  init:
    build:
      context: ../backend
    image: erp-api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      PG_ADMIN_USER: postgres
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD:?}
      # db:setup insists on a second database name; it is created and never used.
      PG_TEST_DATABASE: ${PG_DATABASE:-erp}_unused
    command: ["sh", "-c", "npm run db:setup && npm run db:migrate"]

  api:
    build:
      context: ../backend
    image: erp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment: *api-env
    volumes:
      - storage:/app/storage
      - backups:/app/backups
    # FILE_STORAGE_DRIVER=local means one API instance only: a volume cannot be
    # shared. For more than one, move to FILE_STORAGE_DRIVER=s3.
    expose:
      - "3000"

  # Exactly one. The jobs are idempotent, but two workers would run each twice.
  worker:
    build:
      context: ../backend
    image: erp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment: *api-env
    command: ["node", "dist/worker.js"]
    deploy:
      replicas: 1

  web:
    build:
      context: ../Frontend/web
    image: erp-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side only: the browser never sees this and never calls the API
      # directly. Reached over this private network, so plain http is fine.
      BACKEND_URL: http://api:3000
      ENQUIRY_FORMS: ${ENQUIRY_FORMS:-}
    expose:
      - "3001"

  # Publishes `web` on the internet over HTTPS without opening a single inbound
  # port, and without a public IP address. Create the tunnel in the Cloudflare
  # dashboard (Zero Trust -> Networks -> Tunnels), point its public hostname at
  # http://web:3001, and put the token in infra/.env. Then:
  #   docker compose -f docker-compose.prod.yml --profile tunnel up -d
  cloudflared:
    # Pin a version from hub.docker.com/r/cloudflare/cloudflared/tags once you
    # have chosen one; `latest` keeps the tunnel client patched meanwhile.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - web
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:?set it in infra/.env}"]

volumes:
  pgdata:
  storage: # uploaded documents: NID scans, contracts, expense receipts
  backups: # encrypted backups; copy them off this machine as well
