# Render blueprint for the ERP API (free plan).
#
# One service only, on purpose. Render's free plan has no background worker
# instance type, and its 750 free instance hours a month are shared by the whole
# workspace: one service kept awake all month uses ~730 of them. So the API runs
# the scheduled jobs itself (RUN_JOBS_IN_API=true, src/jobs.ts) instead of
# `npm run start:worker` in a second service.
#
# Use it:  Render dashboard -> New -> Blueprint -> pick this repository.
# Secrets are NOT in this file: every `sync: false` value is typed into the
# Render dashboard once, and Render keeps it.
#
# The database lives in Supabase (see docs/operations/runbooks/deploy-free.md).
# Render's own free PostgreSQL is deliberately not used: it is deleted after 30
# days, which would take the pilot's data with it.

services:
  - type: web
    name: erp-api
    runtime: node
    plan: free
    region: singapore # nearest to Bangladesh of Render's regions
    rootDir: backend
    # --include=dev: NODE_ENV is production below, and npm then skips
    # devDependencies by default — which is where the Nest CLI that runs the
    # build lives (`nest build`). Without it the build fails on "nest: not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    # Render restarts the service if this stops answering. It checks the
    # database too, so a paused Supabase project shows up here (WP12).
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Only rebuild when the API itself changes. Without this, a commit that
    # touches nothing but the Next.js app redeploys the API too — and a free
    # service has no zero-downtime deploy, so the whole site answers "the server
    # cannot be reached" for a few minutes for no reason.
    #
    # Paths are globs relative to the REPOSITORY root, not to rootDir, and an
    # ignored path wins over an included one. This file is a Blueprint, so a
    # change to it is always processed whatever the filter says.
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        # none of these reach the running service
        - backend/test/**
        - backend/**/*.spec.ts
        - backend/**/*.md
        - backend/postman/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24 # same as backend/.node-version and CI
      # Render provides PORT itself; config.ts reads it.

      # --- the scheduled jobs run inside this process ---
      - key: RUN_JOBS_IN_API
        value: true

      # --- the deploy migrates itself ---
      # A free Render service has no shell and no pre-deploy hook, so without
      # this every migration has to be applied by hand from a developer's
      # machine -- which is how 0048 sat unapplied in production for three days
      # while /health/ready reported "1 migration(s) not applied". main.ts
      # applies them before the port is opened, under a pg_advisory_lock, and
      # refuses to start if one fails: serving a half-migrated database is worse
      # than not starting. Safe here precisely because this is a single
      # instance; re-running is a no-op.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: true

      # --- Supabase ---
      # Host and suffix come from Supabase's Connect dialog (Session pooler).
      # Host looks like aws-0-ap-southeast-1.pooler.supabase.com — copy it, do
      # not build it from the region yourself.
      - key: PG_HOST
        sync: false
      - key: PG_PORT
        value: 5432 # session mode. Not 6543: the migration runner takes a
        # session-level advisory lock, which transaction mode drops.
      - key: PG_DATABASE
        value: postgres # Supabase gives one database and will not create another
      - key: PG_USER_SUFFIX
        sync: false # .<project-ref>  (so erp_app logs in as erp_app.<project-ref>)
      - key: PG_SSL
        value: require
      # Session mode holds one server connection per open client connection, and
      # Supabase's pooler allows 15 by default. 8 + 3 stays inside it, with room
      # for the migrations and a psql session of your own.
      - key: PG_POOL_MAX
        value: 8
      - key: PG_POOL_MAX_WORKER
        value: 3
      - key: PG_OWNER_PASSWORD
        sync: false
      - key: PG_APP_PASSWORD
        sync: false
      - key: PG_WORKER_PASSWORD
        sync: false

      # --- secrets (generate each one; never reuse a value from a document) ---
      - key: JWT_SECRET
        generateValue: true # Render generates and stores a long random value
      - key: FIELD_ENCRYPTION_KEY
        sync: false # must be exactly 32 bytes base64; see the runbook
      - key: METRICS_TOKEN
        generateValue: true

      # --- the employee app on Vercel (links in notifications) ---
      - key: PUBLIC_APP_URL
        sync: false # https://<project>.vercel.app
      - key: SECURITY_MFA_ENFORCED
        value: true # production refuses to start with this off

      # --- files: Render's free disk is wiped on every deploy, so uploads
      #     (NID scans, receipts, bank statements) must go to a bucket.
      #     Supabase Storage speaks S3; the keys come from its dashboard.
      - key: FILE_STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        value: erp-files
      - key: S3_ENDPOINT
        sync: false # https://<project-ref>.supabase.co/storage/v1/s3
      - key: S3_REGION
        sync: false # the project's region, e.g. ap-southeast-1
      - key: S3_FORCE_PATH_STYLE
        value: true
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # --- off for now ---
      - key: AI_PROVIDER
        value: 'off' # quoted: YAML would read off as false
      - key: OUTBOX_WEBHOOK_BASE_URL
        value: '' # no free host for n8n; events stay pending, in-app
        # notifications still work
