# Release-gate test set for the AI assistant (guide §16, spec §8 guardrail 10).
#
# Asked as an ordinary employee (Rafi) of a company whose policy documents are the
# illustrative handbook in samples/policies (English and Bangla). Grading, after
# Bangla digits are turned into ASCII and everything is lower-cased:
#   tool     the assistant must have used this tool
#   allOf    every item must appear in the answer
#   anyOf    at least one item must appear
#   noneOf   no item may appear
# An item is a text, or {data: ...} for a value read from the system at run time:
#   myLeaveAvailable:<code>   the asking user's available days of that leave type
#
# Changing the cases or the expected facts does not need a new prompt version, but
# the gate must be run again (npm run ai:eval) before the result counts.

# ---------------------------------------------------------------- policy, English
- id: en-office-hours
  language: en
  question: What are the office hours?
  tool: search_policy
  allOf: ["9", "6"]

- id: en-weekly-holiday-dhaka
  language: en
  question: Which days are the weekly holidays at Dhaka HQ?
  tool: search_policy
  allOf: [friday, saturday]

- id: en-late-three-times
  language: en
  question: What happens if I come late three times in a month?
  tool: search_policy
  allOf: [casual leave]
  anyOf: [one day, 1 day]

- id: en-casual-leave-days
  language: en
  question: How many days of casual leave do I get in a year?
  tool: search_policy
  allOf: ["10"]

- id: en-casual-carry-forward
  language: en
  question: Can unused casual leave be carried forward to next year?
  tool: search_policy
  anyOf: [cannot, can't, "not ", "no,"]

- id: en-sick-certificate
  language: en
  question: When do I need a medical certificate for sick leave?
  tool: search_policy
  allOf: ["2", certificate]

- id: en-earned-leave-max
  language: en
  question: What is the maximum earned leave balance I can carry forward?
  tool: search_policy
  allOf: ["40"]

- id: en-maternity
  language: en
  question: How long is maternity leave?
  tool: search_policy
  anyOf: [16 weeks, "112"]

- id: en-salary-date
  language: en
  question: By which day is the salary paid?
  tool: search_policy
  allOf: ["7"]

- id: en-festival-bonus
  language: en
  question: How much is each festival bonus?
  tool: search_policy
  allOf: [basic]

- id: en-provident-fund
  language: en
  question: How much do I contribute to the provident fund?
  tool: search_policy
  allOf: ["10%"]

- id: en-overtime-rate
  language: en
  question: At what rate is overtime paid?
  tool: search_policy
  anyOf: [twice, double, "2x", "2 times", two times]

- id: en-notice-period
  language: en
  question: How many days of notice must I give if I resign?
  tool: search_policy
  allOf: ["60"]

- id: en-missing-punch
  language: en
  question: How long do I have to correct a missing punch?
  tool: search_policy
  allOf: ["3"]

