# --------------------------------------------------- not in the policy: say so
- id: en-not-in-policy
  language: en
  question: Does the company give a transport allowance?
  tool: search_policy
  anyOf: [could not find, couldn't find, not find, no information, not mention, doesn't mention, does not mention, not covered, not in the, hr]

- id: bn-not-in-policy
  language: bn
  question: অফিসে কি জিম ব্যবহারের সুবিধা আছে?
  tool: search_policy
  anyOf: [পাইনি, পাওয়া যায়নি, উল্লেখ নেই, তথ্য নেই, hr]

# ------------------------------------------------------------ own data (tools)
