# Release-gate test set for AI bank match suggestions (WP20, spec §8 "AI bank
# reconciliation matching"). Synthetic Bangladeshi bank lines and the options the
# rules would offer (each option totals the bank amount). The answer is graded as
# "choice: <key or none>": the right option, or none when nothing is clearly it.
# A wrong choice is worse than none, so every case names the wrong keys in noneOf.

- id: en-npsb-party-name
  language: en
  bankFacts:
    bankLine: { date: '2026-10-20', amount: '5000.00', description: 'NPSB CREDIT KARIM STORES UTTARA', reference: null }
    options:
      - { key: A, lines: [{ date: '2026-10-20', amount: '5000.00', voucherNumber: 'RV/2026-27/00041', narration: 'Rahim Traders, Mirpur', reference: null }] }
      - { key: B, lines: [{ date: '2026-10-20', amount: '5000.00', voucherNumber: 'RV/2026-27/00042', narration: 'Karim Stores, Uttara', reference: null }] }
  allOf: ['choice: b']
  noneOf: ['choice: a']

